name: Encrypt Site with Staticrypt
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build and Encrypt
        run: |
          npm install
          npm run build
          npx staticrypt dist -r -p "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" --short
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./encrypted
